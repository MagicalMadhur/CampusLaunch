<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; height: 100vh; background: #0a0a14; color: #e2e8f0; display: flex; overflow: hidden; }

        /* ── Sidebar ── */
        .sidebar { width: 260px; min-width: 260px; background: linear-gradient(180deg, #111122 0%, #0a0a14 100%); border-right: 1px solid rgba(99,102,241,.15); padding: 28px 20px; display: flex; flex-direction: column; overflow-y: auto; }
        .sidebar h2 { text-align: center; font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; background: linear-gradient(135deg, #6366f1, #818cf8, #a5b4fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .sidebar .subtitle { text-align: center; font-size: .75rem; color: #64748b; margin-bottom: 28px; letter-spacing: 1px; text-transform: uppercase; }
        .sidebar a { color: #94a3b8; text-decoration: none; font-size: .9rem; font-weight: 500; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; transition: all .25s ease; border: 1px solid transparent; margin-bottom: 4px; }
        .sidebar a:hover, .sidebar a.active { background: rgba(99,102,241,.12); color: #c7d2fe; border-color: rgba(99,102,241,.25); }

        /* ── Main ── */
        .main-content { flex: 1; padding: 32px 40px; overflow-y: auto; background: linear-gradient(145deg, #0a0a14 0%, #12121f 40%, #0f1628 100%); }
        .main-content h1 { font-size: 1.6rem; font-weight: 700; color: #f1f5f9; margin-bottom: 4px; }
        .main-content .welcome-sub { font-size: .9rem; color: #64748b; margin-bottom: 24px; }

        /* ── Cards ── */
        .card { background: rgba(18,18,32,.65); backdrop-filter: blur(12px); border: 1px solid rgba(99,102,241,.18); border-radius: 16px; padding: 24px; margin-bottom: 24px; }
        .card h2 { color: #c7d2fe; font-size: 1.1rem; margin-bottom: 8px; }
        .card .count { font-size: 2.8rem; font-weight: 700; background: linear-gradient(135deg, #6366f1, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; margin-top: 8px; }

        .filter-container { background: rgba(18,18,32,.65); backdrop-filter: blur(12px); border: 1px solid rgba(99,102,241,.18); border-radius: 16px; padding: 20px; margin-bottom: 24px; display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
        .filter-container label { font-size: .9rem; color: #c9d1d9; font-weight: 600; }
        .filter-container select { padding: 8px 14px; font-size: .85rem; border-radius: 10px; background: rgba(22,22,40,.85); border: 1px solid rgba(99,102,241,.25); color: #e2e8f0; font-family: 'Inter', sans-serif; outline: none; }
        .filter-container select:focus { border-color: #6366f1; }

        .student-list { background: rgba(18,18,32,.65); backdrop-filter: blur(12px); border: 1px solid rgba(99,102,241,.18); border-radius: 16px; padding: 24px; margin-bottom: 24px; }
        .student-list h3 { color: #f1f5f9; margin-bottom: 16px; }
        .student-list ul { list-style: none; }
        .student-list li { padding: 14px 16px; border-radius: 12px; margin-bottom: 10px; background: rgba(99,102,241,.06); border: 1px solid rgba(99,102,241,.12); transition: all .25s; }
        .student-list li:hover { background: rgba(99,102,241,.12); border-color: rgba(99,102,241,.25); transform: translateX(4px); }
        .student-list li strong { color: #c7d2fe; }
        .student-list li p { color: #94a3b8; font-size: .85rem; margin: 2px 0; }

        .charts-section { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 20px; margin-top: 24px; }
        .chart-container { background: rgba(18,18,32,.65); backdrop-filter: blur(12px); border: 1px solid rgba(99,102,241,.18); border-radius: 16px; padding: 24px; }
        .chart-container h3 { color: #f1f5f9; margin-bottom: 12px; }
        .chart-wrapper { position: relative; height: 300px; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(99,102,241,.25); border-radius: 8px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>CampusLaunch</h2>
        <p class="subtitle">Admin Portal</p>
        <a href="addashboard.html" class="active">📊 Dashboard</a>
        <a href="admin-dashboard.html">👥 Manage Students</a>
        <a href="adminprofile.html">👤 Admin Profile</a>
        <a href="admin-announce.html">📢 Announcements</a>
        <a href="admin-login.html" id="logout">🚪 Logout</a>
    </div>

    <div class="main-content">
        <h1>Admin Dashboard</h1>
        <p class="welcome-sub">Student overview and analytics</p>

        <div class="card" style="text-align:center;">
            <h2>Total Registered Students</h2>
            <div class="count" id="student-count">0</div>
        </div>

        <div class="filter-container">
            <label for="departmentFilter">Department:</label>
            <select id="departmentFilter" onchange="filterStudents()">
                <option value="All">All Departments</option>
                <option value="COMPS">COMPS</option>
                <option value="MECH">MECH</option>
                <option value="EXTC">EXTC</option>
                <option value="AI&DS">AI&DS</option>
                <option value="IT">IT</option>
                <option value="CIVIL">CIVIL</option>
            </select>
            <label for="genderFilter">Gender:</label>
            <select id="genderFilter" onchange="filterStudents()">
                <option value="All">All Genders</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="student-list">
            <h3>Student List</h3>
            <ul id="studentsContainer"></ul>
        </div>

        <div class="charts-section">
            <div class="chart-container">
                <h3>Department Distribution</h3>
                <div class="chart-wrapper"><canvas id="departmentChart"></canvas></div>
            </div>
            <div class="chart-container">
                <h3>Gender Distribution</h3>
                <div class="chart-wrapper"><canvas id="genderChart"></canvas></div>
            </div>
        </div>
    </div>

    <script>
        let students = [];
        let departmentChart, genderChart;

        Chart.defaults.color = '#94a3b8';
        Chart.defaults.borderColor = 'rgba(99,102,241,0.12)';

        function initializeCharts() {
            departmentChart = new Chart(document.getElementById('departmentChart').getContext('2d'), {
                type: 'bar', data: { labels: ['COMPS','MECH','EXTC','AI&DS','IT','CIVIL'], datasets: [{ label: 'Students', data: [], backgroundColor: ['#6366f1','#818cf8','#a5b4fc','#4f46e5','#c7d2fe','#312e81'] }] },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }, plugins: { legend: { display: false } } }
            });
            genderChart = new Chart(document.getElementById('genderChart').getContext('2d'), {
                type: 'pie', data: { labels: ['Male','Female','Other'], datasets: [{ data: [], backgroundColor: ['#6366f1','#a78bfa','#c4b5fd'] }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
            });
        }

        function updateCharts(filtered) {
            const dept = { COMPS:0, MECH:0, EXTC:0, 'AI&DS':0, IT:0, CIVIL:0 };
            const gen = { Male:0, Female:0, Other:0 };
            filtered.forEach(s => { if (dept.hasOwnProperty(s.department?.toUpperCase())) dept[s.department.toUpperCase()]++; if (gen.hasOwnProperty(s.gender)) gen[s.gender]++; });
            departmentChart.data.datasets[0].data = Object.values(dept); departmentChart.update();
            genderChart.data.datasets[0].data = Object.values(gen); genderChart.update();
        }

        async function fetchStudentCount() {
            try { const r = await fetch('http://localhost:3000/students/count'); const d = await r.json(); document.getElementById('student-count').textContent = d.count; } catch(e) { document.getElementById('student-count').textContent = 'Error'; }
        }

        async function fetchStudents() {
            try { const r = await fetch('http://localhost:3000/students'); students = await r.json(); renderStudents(students); updateCharts(students); } catch(e) { console.error(e); }
        }

        function filterStudents() {
            const dept = document.getElementById('departmentFilter').value;
            const gen = document.getElementById('genderFilter').value;
            const filtered = students.filter(s => (dept === 'All' || s.department === dept) && (gen === 'All' || s.gender === gen));
            renderStudents(filtered); updateCharts(filtered);
        }

        function renderStudents(list) {
            const c = document.getElementById('studentsContainer'); c.innerHTML = '';
            list.forEach(s => { const li = document.createElement('li'); li.innerHTML = `<strong>${s.name}</strong><p>Email: ${s.email}</p><p>Phone: ${s.phone}</p><p>Department: ${s.department}</p><p>Gender: ${s.gender}</p>`; c.appendChild(li); });
        }

        document.getElementById('logout').addEventListener('click', function(e) { e.preventDefault(); localStorage.clear(); window.location.href = 'admin-login.html'; });
        window.onload = () => { initializeCharts(); fetchStudentCount(); fetchStudents(); };
    </script>
</body>
</html>
