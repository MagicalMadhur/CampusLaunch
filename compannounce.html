<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements — Company</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; height: 100vh; background: #0a0a14; color: #e2e8f0; display: flex; overflow: hidden; }

        .sidebar { width: 260px; min-width: 260px; background: linear-gradient(180deg, #111122 0%, #0a0a14 100%); border-right: 1px solid rgba(99,102,241,.15); padding: 28px 20px; display: flex; flex-direction: column; overflow-y: auto; }
        .sidebar h2 { text-align: center; font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; background: linear-gradient(135deg, #6366f1, #818cf8, #a5b4fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .sidebar .subtitle { text-align: center; font-size: .75rem; color: #64748b; margin-bottom: 28px; letter-spacing: 1px; text-transform: uppercase; }
        .sidebar a { color: #94a3b8; text-decoration: none; font-size: .9rem; font-weight: 500; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; transition: all .25s ease; border: 1px solid transparent; margin-bottom: 4px; }
        .sidebar a:hover, .sidebar a.active { background: rgba(99,102,241,.12); color: #c7d2fe; border-color: rgba(99,102,241,.25); }

        .main-content { flex: 1; padding: 32px 40px; overflow-y: auto; background: linear-gradient(145deg, #0a0a14 0%, #12121f 40%, #0f1628 100%); }
        .main-content h1 { font-size: 1.6rem; font-weight: 700; color: #f1f5f9; margin-bottom: 4px; }
        .main-content .welcome-sub { font-size: .9rem; color: #64748b; margin-bottom: 24px; }

        .announcement-section { margin-bottom: 24px; }
        .announcement { background: rgba(18,18,32,.65); backdrop-filter: blur(12px); border: 1px solid rgba(99,102,241,.18); border-radius: 16px; padding: 20px 24px; margin-bottom: 14px; transition: all .25s; }
        .announcement:hover { border-color: rgba(99,102,241,.35); }
        .announcement h3 { color: #c7d2fe; font-size: 1.05rem; margin-bottom: 8px; }
        .announcement p { color: #94a3b8; font-size: .9rem; line-height: 1.5; }
        .announcement small { color: #64748b; font-size: .75rem; }

        .btn-create { display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(135deg, #6366f1, #818cf8); color: #fff; padding: 12px 24px; font-size: .9rem; font-weight: 600; font-family: 'Inter', sans-serif; border: none; border-radius: 12px; cursor: pointer; text-decoration: none; transition: all .25s; }
        .btn-create:hover { background: linear-gradient(135deg, #4f46e5, #6366f1); box-shadow: 0 6px 20px rgba(99,102,241,.35); transform: translateY(-1px); }

        .delete-btn { background: rgba(239,68,68,.15); color: #fca5a5; border: 1px solid rgba(239,68,68,.25); padding: 6px 14px; font-size: .8rem; font-weight: 600; font-family: 'Inter', sans-serif; border-radius: 8px; cursor: pointer; transition: all .25s; margin-top: 10px; }
        .delete-btn:hover { background: rgba(239,68,68,.25); color: #fecaca; }

        .empty-state { text-align: center; padding: 40px; color: #64748b; background: rgba(18,18,32,.65); border: 1px solid rgba(99,102,241,.18); border-radius: 16px; }

        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: rgba(99,102,241,.25); border-radius: 8px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>CampusLaunch</h2>
        <p class="subtitle">Company Portal</p>
        <a href="compannounce.html" class="active">📊 Dashboard</a>
        <a href="#">🏢 Company Profile</a>
        <a href="company-login.html" id="logout">🚪 Logout</a>
    </div>

    <div class="main-content">
        <h1>📢 Announcements</h1>
        <p class="welcome-sub">Manage placement announcements</p>
        <div class="announcement-section">
            <p style="color:#64748b;">Loading announcements...</p>
        </div>
        <a href="create_ann.html" class="btn-create">➕ Create Announcement</a>
    </div>

    <script>
        async function fetchAnnouncements() {
            try {
                const r = await fetch('http://localhost:3000/announcements');
                const data = await r.json();
                const section = document.querySelector('.announcement-section');
                if (data.length === 0) { section.innerHTML = '<div class="empty-state"><p>No announcements yet.</p></div>'; }
                else { section.innerHTML = data.map(a => `<div class="announcement"><h3>${a.title}</h3><p>${a.content}</p><p><small>${new Date(a.createdAt).toLocaleString()}</small></p><button class="delete-btn" onclick="deleteAnnouncement('${a._id}')">🗑️ Delete</button></div>`).join(''); }
            } catch(e) { console.error(e); }
        }
        async function deleteAnnouncement(id) {
            if (!confirm('Delete this announcement?')) return;
            try { const r = await fetch(`http://localhost:3000/announcements/${id}`, { method: 'DELETE' }); const d = await r.json(); alert(d.message); fetchAnnouncements(); } catch(e) { console.error(e); }
        }
        document.getElementById('logout').addEventListener('click', function(e) { e.preventDefault(); localStorage.clear(); window.location.href = 'company-login.html'; });
        window.onload = fetchAnnouncements;
    </script>
</body>
</html>
