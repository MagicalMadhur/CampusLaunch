<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; height: 100vh; background: #0a0a14; color: #e2e8f0; display: flex; overflow: hidden; }

        .sidebar { width: 260px; min-width: 260px; background: linear-gradient(180deg, #111122 0%, #0a0a14 100%); border-right: 1px solid rgba(99,102,241,.15); padding: 28px 20px; display: flex; flex-direction: column; overflow-y: auto; }
        .sidebar h2 { text-align: center; font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; background: linear-gradient(135deg, #6366f1, #818cf8, #a5b4fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .sidebar .subtitle { text-align: center; font-size: .75rem; color: #64748b; margin-bottom: 28px; letter-spacing: 1px; text-transform: uppercase; }
        .sidebar a { color: #94a3b8; text-decoration: none; font-size: .9rem; font-weight: 500; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; transition: all .25s ease; border: 1px solid transparent; margin-bottom: 4px; }
        .sidebar a:hover, .sidebar a.active { background: rgba(99,102,241,.12); color: #c7d2fe; border-color: rgba(99,102,241,.25); }

        .profile-container { flex: 1; display: flex; justify-content: center; align-items: center; background: linear-gradient(145deg, #0a0a14 0%, #12121f 40%, #0f1628 100%); }
        .profile-card { background: rgba(18,18,32,.65); backdrop-filter: blur(12px); border: 1px solid rgba(99,102,241,.18); border-radius: 16px; padding: 36px; width: 480px; }
        .profile-card h1 { text-align: center; color: #f1f5f9; margin-bottom: 24px; font-size: 1.4rem; }
        .profile-field { margin-bottom: 16px; }
        .profile-field label { display: block; margin-bottom: 6px; color: #94a3b8; font-size: .85rem; font-weight: 600; }
        .profile-field input { width: 100%; padding: 10px 14px; background: rgba(22,22,40,.85); border: 1px solid rgba(99,102,241,.25); border-radius: 10px; color: #e2e8f0; font-family: 'Inter', sans-serif; font-size: .9rem; outline: none; }
        .profile-field input:focus { border-color: #6366f1; box-shadow: 0 0 12px rgba(99,102,241,.2); }
        .profile-field input:disabled { opacity: .6; }

        .profile-buttons { display: flex; gap: 12px; margin-top: 24px; }
        .btn { padding: 10px 20px; border: none; border-radius: 10px; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; transition: all .25s; flex: 1; text-align: center; }
        .btn-edit { background: linear-gradient(135deg, #6366f1, #818cf8); color: #fff; }
        .btn-edit:hover { background: linear-gradient(135deg, #4f46e5, #6366f1); box-shadow: 0 6px 20px rgba(99,102,241,.35); }
        .btn-save { background: linear-gradient(135deg, #22c55e, #4ade80); color: #fff; display: none; }
        .btn-save:hover { box-shadow: 0 6px 20px rgba(34,197,94,.35); }
        .btn-cancel { background: rgba(239,68,68,.15); color: #fca5a5; border: 1px solid rgba(239,68,68,.25); display: none; }
        .btn-cancel:hover { background: rgba(239,68,68,.25); }

        .error-message { color: #fca5a5; text-align: center; margin-top: 12px; font-size: .85rem; }
        .success-message { color: #86efac; text-align: center; margin-top: 12px; font-size: .85rem; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>CampusLaunch</h2>
        <p class="subtitle">Admin Portal</p>
        <a href="addashboard.html">📊 Dashboard</a>
        <a href="admin-dashboard.html">👥 Manage Students</a>
        <a href="adminprofile.html" class="active">👤 Admin Profile</a>
        <a href="admin-announce.html">📢 Announcements</a>
        <a href="#" id="logout-link">🚪 Logout</a>
    </div>

    <div class="profile-container">
        <div class="profile-card">
            <h1>👤 Admin Profile</h1>
            <form id="profile-form">
                <div class="profile-field"><label for="username">Username</label><input type="text" id="username" readonly></div>
                <div class="profile-field"><label for="name">Name</label><input type="text" id="name" disabled></div>
                <div class="profile-field"><label for="email">Email</label><input type="email" id="email" disabled></div>
                <div class="profile-field"><label for="phone">Phone</label><input type="tel" id="phone" disabled></div>
                <div class="profile-field"><label for="position">Position</label><input type="text" id="position" disabled></div>
            </form>
            <div class="profile-buttons">
                <button id="edit-btn" class="btn btn-edit">✏️ Edit Profile</button>
                <button id="save-btn" class="btn btn-save">💾 Save Changes</button>
                <button id="cancel-btn" class="btn btn-cancel">Cancel</button>
            </div>
            <div id="error-message" class="error-message"></div>
            <div id="success-message" class="success-message"></div>
        </div>
    </div>

    <script>
        function checkAuth() {
            const adminData = JSON.parse(localStorage.getItem('adminData'));
            if (!adminData || !adminData.username) { window.location.href = 'admin-login.html'; return false; }
            return adminData;
        }

        const usernameInput = document.getElementById('username'), nameInput = document.getElementById('name'), emailInput = document.getElementById('email'), phoneInput = document.getElementById('phone'), positionInput = document.getElementById('position');
        const editBtn = document.getElementById('edit-btn'), saveBtn = document.getElementById('save-btn'), cancelBtn = document.getElementById('cancel-btn');
        const errorMessage = document.getElementById('error-message'), successMessage = document.getElementById('success-message');
        let originalProfileData = {};

        async function fetchAdminProfile() {
            const adminData = checkAuth(); if (!adminData) return;
            try {
                const r = await fetch(`http://localhost:3000/admin/profile?username=${adminData.username}`);
                if (!r.ok) throw new Error("Failed to fetch profile");
                const d = await r.json();
                usernameInput.value = d.username; nameInput.value = d.name || ''; emailInput.value = d.email || ''; phoneInput.value = d.phone || ''; positionInput.value = d.position || '';
                originalProfileData = { ...d };
            } catch(e) { errorMessage.textContent = e.message; }
        }

        function toggleEditMode(isEditing) {
            [nameInput, emailInput, phoneInput, positionInput].forEach(f => f.disabled = !isEditing);
            editBtn.style.display = isEditing ? 'none' : 'block'; saveBtn.style.display = isEditing ? 'block' : 'none'; cancelBtn.style.display = isEditing ? 'block' : 'none';
            if (!isEditing) { errorMessage.textContent = ''; successMessage.textContent = ''; }
        }

        async function saveProfile() {
            const adminData = checkAuth(); if (!adminData) return;
            const body = { username: adminData.username, name: nameInput.value, email: emailInput.value, phone: phoneInput.value, position: positionInput.value };
            try {
                const r = await fetch('http://localhost:3000/admin/update', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                if (!r.ok) throw new Error("Failed to update profile");
                successMessage.textContent = "Profile updated successfully"; toggleEditMode(false); originalProfileData = { ...body };
            } catch(e) { errorMessage.textContent = e.message; }
        }

        function cancelEdit() { nameInput.value = originalProfileData.name || ''; emailInput.value = originalProfileData.email || ''; phoneInput.value = originalProfileData.phone || ''; positionInput.value = originalProfileData.position || ''; toggleEditMode(false); }

        document.addEventListener('DOMContentLoaded', fetchAdminProfile);
        editBtn.addEventListener('click', () => toggleEditMode(true));
        saveBtn.addEventListener('click', saveProfile);
        cancelBtn.addEventListener('click', cancelEdit);
        document.getElementById('logout-link').addEventListener('click', (e) => { e.preventDefault(); localStorage.clear(); window.location.href = 'admin-login.html'; });
    </script>
</body>
</html>
