<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Announcement</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; min-height: 100vh; background: linear-gradient(145deg, #0a0a14 0%, #12121f 40%, #0f1628 100%); color: #e2e8f0; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        .page-header { text-align: center; margin-bottom: 32px; }
        .page-header h1 { font-size: 1.8rem; font-weight: 700; background: linear-gradient(135deg, #6366f1, #818cf8, #a5b4fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; }
        .page-header p { color: #64748b; font-size: .9rem; }

        .form-container { width: 520px; max-width: 90%; background: rgba(18,18,32,.65); backdrop-filter: blur(12px); border: 1px solid rgba(99,102,241,.18); border-radius: 16px; padding: 32px; }

        label { display: block; margin-bottom: 6px; font-size: .85rem; font-weight: 600; color: #94a3b8; }
        input[type="text"], textarea { width: 100%; padding: 12px 14px; margin-bottom: 18px; background: rgba(22,22,40,.85); border: 1px solid rgba(99,102,241,.25); border-radius: 10px; color: #e2e8f0; font-family: 'Inter', sans-serif; font-size: .9rem; outline: none; resize: vertical; }
        input[type="text"]:focus, textarea:focus { border-color: #6366f1; box-shadow: 0 0 12px rgba(99,102,241,.2); }
        textarea { min-height: 120px; }

        .btn-submit { width: 100%; padding: 12px; background: linear-gradient(135deg, #6366f1, #818cf8); color: #fff; border: none; border-radius: 12px; font-size: .95rem; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; transition: all .25s; }
        .btn-submit:hover { background: linear-gradient(135deg, #4f46e5, #6366f1); box-shadow: 0 6px 20px rgba(99,102,241,.35); transform: translateY(-1px); }

        .btn-back { display: inline-block; margin-top: 16px; color: #818cf8; text-decoration: none; font-size: .85rem; font-weight: 500; transition: color .2s; }
        .btn-back:hover { color: #a5b4fc; }

        .alert { text-align: center; color: #fca5a5; font-size: .85rem; margin-top: 12px; }
        .success { text-align: center; color: #86efac; font-size: .85rem; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="page-header">
        <h1>📢 Create Announcement</h1>
        <p>Share updates with students and staff</p>
    </div>

    <div class="form-container">
        <form id="announcementForm">
            <label for="title">Title</label>
            <input type="text" id="title" placeholder="Announcement title..." required>

            <label for="content">Content</label>
            <textarea id="content" placeholder="Write your announcement here..." required></textarea>

            <button type="submit" class="btn-submit">📤 Publish Announcement</button>
        </form>
        <div id="statusMsg"></div>
        <a href="#" id="backLink" class="btn-back">← Back to Dashboard</a>
    </div>

    <script>
        // Determine who is logged in to redirect correctly
        function getRedirectUrl() {
            const adminData = localStorage.getItem('adminData');
            const companyData = localStorage.getItem('companyData');
            if (adminData) return 'admin-announce.html';
            if (companyData) return 'compannounce.html';
            // Fallback: check referrer
            if (document.referrer.includes('comp')) return 'compannounce.html';
            return 'admin-announce.html';
        }

        // Set the back link
        document.getElementById('backLink').href = getRedirectUrl();

        document.getElementById("announcementForm").addEventListener("submit", async function (event) {
            event.preventDefault();
            const statusMsg = document.getElementById('statusMsg');

            const title = document.getElementById("title").value;
            const content = document.getElementById("content").value;

            try {
                const response = await fetch("http://localhost:3000/announcements", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ title, content }),
                });

                if (response.ok) {
                    statusMsg.className = 'success';
                    statusMsg.textContent = '✅ Announcement created successfully!';
                    // Redirect to the correct page after a short delay
                    setTimeout(() => {
                        window.location.href = getRedirectUrl();
                    }, 1000);
                } else {
                    statusMsg.className = 'alert';
                    statusMsg.textContent = '❌ Error creating announcement.';
                }
            } catch (err) {
                statusMsg.className = 'alert';
                statusMsg.textContent = '❌ Server error: ' + err.message;
            }
        });
    </script>
</body>
</html>
